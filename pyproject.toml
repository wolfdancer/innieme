[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "innieme"
version = "0.1.0"
description = "Your bot description"
requires-python = ">=3.13"
dependencies = [
    "discord.py",
    "slack-bolt",
    "python-dotenv",
    "chromadb",
    "langchain-core",
    "langchain-text-splitters",
    "langchain-community",
    "langchain-chroma",
    "langchain-huggingface",
    "langchain-openai",
    "pypdf",
    "python-docx",
    "faiss-cpu",
    "numpy",
    "openai>=1.0.0",
    "pydantic-ai>=2.64.0",
    "audioop-lts==0.2.2; python_version >= '3.13'",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "black",
    "flake8",
    "isort",
]

[project.scripts]
innieme_bot = "innieme.cli.run_bot:main"
innieme_slack_bot = "innieme.cli.run_slack_bot:main"
innieme = "innieme.cli.run_unified_bot:main"

[tool.setuptools]
py-modules = []
packages = ["innieme"]
package-dir = {"innieme" = "src/innieme"}
[tool.isort]
# Match black, which this repo also runs: without a profile the two disagree
# on how to wrap long imports and cannot both pass.
profile = "black"
