# Slack Bot Configuration Example
# Copy this to slack_config.yaml and fill in your actual values

# Slack Bot Token (starts with xoxb-)
# Get this from your Slack app's OAuth & Permissions page
slack_bot_token: "xoxb-your-bot-token-here"

# Slack App Token (starts with xapp-)
# Get this from your Slack app's Basic Information page (App-Level Tokens section)
# Required for Socket Mode
slack_app_token: "xapp-your-app-token-here"

# API key for the embedding model (required when embedding_model is "openai")
embeddings_api_key: "your-embeddings-api-key"

# Embedding model to use: openai, huggingface, or fake
embedding_model: "openai"

# Embedding model name. Backend-specific. When unset, each backend uses its own
# default: OpenAI -> text-embedding-3-small, HuggingFace -> all-MiniLM-L6-v2.
# embeddings_model_name: "text-embedding-3-small"

# LLM to use for conversation and summarisation
# Format: "<provider>:<model>", e.g. "openai:gpt-5.6-terra",
# "anthropic:claude-sonnet-5". Check the provider's docs for current model IDs.
llm_model: "openai:gpt-5.6-terra"

# API key for the LLM provider
llm_api_key: "your-llm-api-key"

# Where downloaded embedding models are cached. Only used when embedding_model
# is "huggingface". Supports "~". When unset, defaults to a .cache directory
# inside each topic's docs_dir.
# cache_dir: "~/.cache/innieme"

# How many document chunks to send to the model as context per query.
# Higher values improve recall at the cost of more input tokens. Defaults to 5.
# retrieval_top_k: 10

# Optional relevance floor between 0 and 1. When set, retrieved chunks scoring
# below it are dropped, so a query with few relevant chunks returns only those
# instead of padding the context out to retrieval_top_k. Unset means no
# filtering, which is the safe default: too high a value makes the bot answer
# "not in the documents" for things that are. Measure before setting it --
# compare scores for questions you know are answerable against ones you know
# are not, and pick a value between the two ranges.
# retrieval_score_threshold: 0.3

# Bot administrators and their topics
outies:
  - outie_id: "U1234567890"  # Slack User ID (starts with U)
    topics:
      - name: "math"
        role: "You are a helpful math tutor. Answer math questions clearly and provide step-by-step explanations."
        docs_dir: "./docs/math"  # Directory containing math documents
        # Filenames to skip in this topic's docs_dir. Each pattern is matched
        # against both the filename and the docs_dir-relative path, so
        # "CLAUDE.md" skips it at any depth and "archive/*" skips a subfolder.
        # Defaults to ["CLAUDE.md"]: agent instruction files are not
        # subject-matter content, and a retrieved chunk of instructions gets
        # followed as directions. Use [] to scan everything.
        # docs_exclude:
        #   - "CLAUDE.md"
        #   - "*-draft.md"
        channels:
          - channel_id: "C1234567890"  # Slack Channel ID (starts with C)
      
      - name: "science"
        role: "You are a knowledgeable science teacher. Explain scientific concepts in an accessible way."
        docs_dir: "./docs/science"
        channels:
          - channel_id: "C0987654321"

  - outie_id: "U0987654321"  # Another administrator
    topics:
      - name: "support"
        role: "You are a helpful customer support agent. Be friendly and solution-oriented."
        docs_dir: "./docs/support"
        channels:
          - channel_id: "C5555555555"

# To get Slack IDs:
# - User IDs: Right-click on a user in Slack → Copy → Member ID
# - Channel IDs: Right-click on a channel → Copy → Channel ID
# 
# To set up your Slack app:
# 1. Go to https://api.slack.com/apps
# 2. Create a new app "From scratch"
# 3. Add Bot Token Scopes: app_mentions:read, channels:history, channels:read, chat:write, files:write, im:history, im:read, users:read
# 4. Enable Socket Mode and create an App-Level Token with connections:write scope
# 5. Install the app to your workspace
# 6. Invite the bot to your channels: /invite @your-bot-name